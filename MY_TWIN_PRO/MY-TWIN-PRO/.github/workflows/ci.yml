name: CI
on: [push, pull_request]
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - run: npx tsc --noEmit --pretty false
      - run: npm test -- --runInBand --passWithNoTests
      - run: git diff --check
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q -r backend/requirements-dev.txt
      - run: python -m compileall -q backend/app backend/main.py
      - run: >-
          PYTHONPATH=backend pytest -q
          backend/tests/test_life_loop_closure.py
          backend/tests/test_s5_5_3_production_gate_contract.py
          backend/tests/test_s6a_entity_identity_foundation.py
          backend/tests/test_s6v_visual_presence_policy.py
      - name: Architecture gates
        shell: bash
        run: |
          set -euo pipefail
          for gate in \
            scripts/verify_reconciled_backbone.py \
            scripts/verify_life_loop_closure.py \
            scripts/verify_dormant_engine_safety.py \
            scripts/verify_appstate_lifecycle.py \
            scripts/verify_s5_5_core_hardening.py \
            scripts/verify_s5_5_2_atomic_commit.py; do
            python "$gate"
          done
